    <rect x="250" y="542" width="316" height="16" rx="3" fill="#2563eb"/><text x="574" y="555" class="value">2.11×</text>
    <rect x="250" y="562" width="393" height="16" rx="3" fill="#0f766e"/><text x="651" y="575" class="value">2.62×</text>
    <rect x="250" y="582" width="160" height="16" rx="3" fill="#c2410c"/><text x="418" y="595" class="value">1.07×</text>
