<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-year workload speedups</title>
  <desc id="desc">Grouped horizontal bars compare WalkForward (228 solves), MultipleRandomizedCV (480 solves), and six-solve purged CPCV for five risk measures over 5,040 synthetic daily returns. Variance with many overlapping OSQP folds is the large speedup; scenario Clarabel stays near 2–4×, and six-solve CPCV is near break-even.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #55627a; }
    .label { font-size: 16px; font-weight: 600; }
    .value { font-size: 13px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
  </style>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="50" y="48" class="title">20-year workloads: the win is many OSQP folds</text>
  <text x="50" y="74" class="subtitle">5,040 × 20 synthetic daily returns; native skfolio n_jobs=1. Speedup is native wall time / accelerated wall time. Bars start at 0×.</text>
  <rect x="520" y="92" width="14" height="14" rx="2" fill="#2563eb"/><text x="540" y="104" class="note">WalkForward · 228 solves</text>
  <rect x="740" y="92" width="14" height="14" rx="2" fill="#0f766e"/><text x="760" y="104" class="note">MRC · 480 solves</text>
  <rect x="930" y="92" width="14" height="14" rx="2" fill="#c2410c"/><text x="950" y="104" class="note">CPCV · 6 solves</text>
  <!-- scale: x = 250 + speedup * 9.375; 80× → 1000 -->
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="128" x2="1000" y2="128"/>
    <line x1="250" y1="128" x2="250" y2="575"/>
    <line x1="344" y1="128" x2="344" y2="575"/>
    <line x1="438" y1="128" x2="438" y2="575"/>
    <line x1="531" y1="128" x2="531" y2="575"/>
    <line x1="625" y1="128" x2="625" y2="575"/>
    <line x1="719" y1="128" x2="719" y2="575"/>
    <line x1="813" y1="128" x2="813" y2="575"/>
    <line x1="906" y1="128" x2="906" y2="575"/>
    <line x1="1000" y1="128" x2="1000" y2="575"/>
  </g>
  <g class="axis">
    <text x="246" y="116">0×</text>
    <text x="335" y="116">10×</text>
    <text x="429" y="116">20×</text>
    <text x="522" y="116">30×</text>
    <text x="616" y="116">40×</text>
    <text x="710" y="116">50×</text>
    <text x="804" y="116">60×</text>
    <text x="897" y="116">70×</text>
    <text x="986" y="116">80×</text>
  </g>
  <g>
    <text x="50" y="186" class="label">Variance</text>
    <rect x="250" y="150" width="568" height="16" rx="3" fill="#2563eb"/><text x="826" y="163" class="value">60.6×</text>
    <rect x="250" y="170" width="721" height="16" rx="3" fill="#0f766e"/><text x="979" y="183" class="value">76.9×</text>
    <rect x="250" y="190" width="111" height="16" rx="3" fill="#c2410c"/><text x="369" y="203" class="value">11.8×</text>

    <text x="50" y="266" class="label">Semi-variance</text>
    <rect x="250" y="230" width="22" height="16" rx="3" fill="#2563eb"/><text x="280" y="243" class="value">2.3×</text>
    <rect x="250" y="250" width="28" height="16" rx="3" fill="#0f766e"/><text x="286" y="263" class="value">3.0×</text>
    <rect x="250" y="270" width="9" height="16" rx="3" fill="#c2410c"/><text x="267" y="283" class="value">0.98×</text>

    <text x="50" y="346" class="label">MAD</text>
    <rect x="250" y="310" width="22" height="16" rx="3" fill="#2563eb"/><text x="280" y="323" class="value">2.3×</text>
    <rect x="250" y="330" width="29" height="16" rx="3" fill="#0f766e"/><text x="287" y="343" class="value">3.1×</text>
    <rect x="250" y="350" width="10" height="16" rx="3" fill="#c2410c"/><text x="268" y="363" class="value">1.1×</text>

    <text x="50" y="426" class="label">CVaR</text>
    <rect x="250" y="390" width="31" height="16" rx="3" fill="#2563eb"/><text x="289" y="403" class="value">3.3×</text>
    <rect x="250" y="410" width="39" height="16" rx="3" fill="#0f766e"/><text x="297" y="423" class="value">4.1×</text>
    <rect x="250" y="430" width="10" height="16" rx="3" fill="#c2410c"/><text x="268" y="443" class="value">1.1×</text>

    <text x="50" y="506" class="label">Maximum drawdown</text>
    <rect x="250" y="470" width="20" height="16" rx="3" fill="#2563eb"/><text x="278" y="483" class="value">2.2×</text>
    <rect x="250" y="490" width="25" height="16" rx="3" fill="#0f766e"/><text x="283" y="503" class="value">2.6×</text>
    <rect x="250" y="510" width="10" height="16" rx="3" fill="#c2410c"/><text x="268" y="523" class="value">1.1×</text>
  </g>
  <line x1="50" y1="555" x2="1070" y2="555" stroke="#dce3ef"/>
  <text x="50" y="582" class="note">Maximum path-Sharpe differences: variance 4.3e-5; semi-variance 1.1e-16; MAD 2.1e-6; CVaR 7.4e-6; maximum drawdown 1.6e-7.</text>
  <text x="50" y="604" class="note">Six CPCV splits still rebuild a Clarabel problem per fold, so scenario risks are break-even. Variance stays faster because OSQP reuses the same QP shape.</text>
  <text x="50" y="626" class="note">Source: benchmarks/benchmark_matrix.py --repeats 3, focused risk families; Python 3.12, skfolio 1.0.0. Median of three isolated-process runs.</text>
  <text x="50" y="648" class="note">WalkForward 228 solves, MRC 480 solves, CombinatorialPurgedCV 6 solves (n_folds=4, n_test_folds=2, purge=1, embargo=1).</text>
</svg>
