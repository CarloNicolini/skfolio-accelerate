    <text x="50" y="710" class="label">Ulcer index · min risk</text>
    <text x="50" y="728" class="engine">sequential CVXPY</text>
    <rect x="250" y="682" width="262" height="16" rx="3" fill="#2563eb"/><text x="520" y="695" class="value">1.74×</text>
