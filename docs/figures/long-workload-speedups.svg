<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1180" viewBox="0 0 1120 1180" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-year workload speedups across CV methods</title>
  <desc id="desc">WalkForward, MultipleRandomizedCV, and purged CPCV on 5,040 × 20 synthetic daily returns. Auto selects OSQP, Clarabel, sequential CVXPY, or fit-assemble for every MeanRisk objective × risk pair.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #55627a; }
    .label { font-size: 14px; font-weight: 600; }
    .engine { font-size: 12px; fill: #66748c; }
    .value { font-size: 13px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
    .section { font-size: 14px; font-weight: 700; fill: #33415c; }
  </style>
  <rect width="1120" height="1180" fill="#ffffff"/>
  <text x="50" y="44" class="title">20-year workloads across WalkForward, MRC, and CPCV</text>
  <text x="50" y="68" class="subtitle">5,040 × 20 synthetic daily returns; native skfolio n_jobs=1. Auto covers ObjectiveFunction × RiskMeasure; bars start at 0×. Red = slower than native.</text>
  <rect x="520" y="84" width="14" height="14" rx="2" fill="#2563eb"/><text x="540" y="96" class="note">WalkForward · 228 solves</text>
  <rect x="760" y="84" width="14" height="14" rx="2" fill="#0f766e"/><text x="780" y="96" class="note">MRC · 480 solves</text>
  <rect x="960" y="84" width="14" height="14" rx="2" fill="#c2410c"/><text x="980" y="96" class="note">CPCV · 6 solves</text>
  <text x="50" y="128" class="section">Boxed variance (compact OSQP, 0–80×)</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="140" x2="1000" y2="140"/>
    <line x1="250" y1="140" x2="250" y2="286"/>
    <line x1="438" y1="140" x2="438" y2="286"/>
    <line x1="625" y1="140" x2="625" y2="286"/>
    <line x1="813" y1="140" x2="813" y2="286"/>
    <line x1="1000" y1="140" x2="1000" y2="286"/>
  </g>
