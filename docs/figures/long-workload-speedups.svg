<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
  <title id="title">Twenty-year workload speedups</title>
  <desc id="desc">Grouped horizontal bars compare WalkForward and MultipleRandomizedCV speedups for five representative risk measures over 5,040 synthetic daily returns.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #55627a; }
    .label { font-size: 16px; font-weight: 600; }
    .value { font-size: 13px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
  </style>
  <rect width="1120" height="640" fill="#ffffff"/>
  <text x="50" y="55" class="title">Representative 20-year workloads</text>
  <text x="50" y="82" class="subtitle">5,040 synthetic daily returns; native skfolio n_jobs=1. Speedup is native wall time / accelerated wall time.</text>
  <rect x="760" y="100" width="16" height="16" rx="3" fill="#2563eb"/><text x="783" y="114" class="note">WalkForward (228 solves)</text>
  <rect x="940" y="100" width="16" height="16" rx="3" fill="#0f766e"/><text x="963" y="114" class="note">MRC (480 solves)</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="145" x2="1030" y2="145"/>
    <line x1="250" y1="145" x2="250" y2="535"/><line x1="354" y1="145" x2="354" y2="535"/><line x1="458" y1="145" x2="458" y2="535"/><line x1="562" y1="145" x2="562" y2="535"/>
    <line x1="666" y1="145" x2="666" y2="535"/><line x1="770" y1="145" x2="770" y2="535"/><line x1="874" y1="145" x2="874" y2="535"/><line x1="978" y1="145" x2="978" y2="535"/>
  </g>
  <g class="axis"><text x="246" y="132">0x</text><text x="346" y="132">10x</text><text x="450" y="132">20x</text><text x="554" y="132">30x</text><text x="658" y="132">40x</text><text x="762" y="132">50x</text><text x="866" y="132">60x</text><text x="970" y="132">70x</text></g>
  <g>
    <text x="50" y="198" class="label">Variance</text><rect x="250" y="171" width="646" height="21" rx="4" fill="#2563eb"/><text x="906" y="187" class="value">62.1x</text><rect x="250" y="198" width="783" height="21" rx="4" fill="#0f766e"/><text x="1043" y="214" class="value">75.3x</text>
    <text x="50" y="268" class="label">Semi-variance</text><rect x="250" y="241" width="24" height="21" rx="4" fill="#2563eb"/><text x="284" y="257" class="value">2.3x</text><rect x="250" y="268" width="31" height="21" rx="4" fill="#0f766e"/><text x="291" y="284" class="value">3.0x</text>
    <text x="50" y="338" class="label">MAD</text><rect x="250" y="311" width="23" height="21" rx="4" fill="#2563eb"/><text x="283" y="327" class="value">2.2x</text><rect x="250" y="338" width="32" height="21" rx="4" fill="#0f766e"/><text x="292" y="354" class="value">3.1x</text>
    <text x="50" y="408" class="label">CVaR</text><rect x="250" y="381" width="34" height="21" rx="4" fill="#2563eb"/><text x="294" y="397" class="value">3.3x</text><rect x="250" y="408" width="44" height="21" rx="4" fill="#0f766e"/><text x="304" y="424" class="value">4.2x</text>
    <text x="50" y="478" class="label">Maximum drawdown</text><rect x="250" y="451" width="22" height="21" rx="4" fill="#2563eb"/><text x="282" y="467" class="value">2.1x</text><rect x="250" y="478" width="27" height="21" rx="4" fill="#0f766e"/><text x="287" y="494" class="value">2.6x</text>
  </g>
  <line x1="50" y1="555" x2="1070" y2="555" stroke="#dce3ef"/>
  <text x="50" y="580" class="note">Maximum path-Sharpe differences: variance 4.3e-5; semi-variance 1.1e-16; MAD 2.1e-6; CVaR 7.4e-6; maximum drawdown 1.6e-7.</text>
  <text x="50" y="604" class="note">Small scenario-based CPCV workloads were near break-even, so this chart is not a claim of a universal speedup.</text>
  <text x="50" y="625" class="note">Source: benchmark_matrix.py --repeats 3, focused representative risk families.</text>
</svg>
