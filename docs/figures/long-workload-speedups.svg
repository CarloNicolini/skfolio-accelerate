    <text x="50" y="780" class="label">Variance · max return</text>
    <text x="50" y="798" class="engine">sequential CVXPY</text>
    <rect x="250" y="752" width="411" height="16" rx="3" fill="#2563eb"/><text x="669" y="765" class="value">2.74×</text>
