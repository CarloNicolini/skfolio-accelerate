    <text x="996" y="132">80×</text>
  </g>
  <g>
    <text x="50" y="176" class="label">Variance · min risk</text>
    <text x="50" y="194" class="engine">compact OSQP</text>
    <rect x="250" y="148" width="438" height="16" rx="3" fill="#2563eb"/><text x="696" y="161" class="value">46.7×</text>
    <rect x="250" y="168" width="452" height="16" rx="3" fill="#0f766e"/><text x="710" y="181" class="value">48.2×</text>
    <rect x="250" y="188" width="101" height="16" rx="3" fill="#c2410c"/><text x="359" y="201" class="value">10.8×</text>
    <text x="50" y="246" class="label">Variance · max utility</text>
    <text x="50" y="264" class="engine">compact OSQP</text>
    <rect x="250" y="218" width="501" height="16" rx="3" fill="#2563eb"/><text x="759" y="231" class="value">53.4×</text>
    <rect x="250" y="238" width="335" height="16" rx="3" fill="#0f766e"/><text x="593" y="251" class="value">35.7×</text>
    <rect x="250" y="258" width="106" height="16" rx="3" fill="#c2410c"/><text x="364" y="271" class="value">11.3×</text>
  </g>
  <text x="50" y="312" class="section">Same 20-year data: Clarabel, sequential CVXPY, and fit-assemble (0–5×)</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="324" x2="1000" y2="324"/>
    <line x1="250" y1="324" x2="250" y2="1024"/>
