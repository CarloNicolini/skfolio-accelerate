<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="690" viewBox="0 0 1120 690" role="img" aria-labelledby="title desc">
  <title id="title">Quick benchmark speedup ranges</title>
  <desc id="desc">Horizontal bars show observed native single-threaded wall time divided by accelerated wall time across three synthetic CV workloads.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 15px; fill: #55627a; }
    .label { font-size: 16px; font-weight: 600; }
    .value { font-size: 14px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
  </style>
  <rect width="1120" height="690" fill="#ffffff"/>
  <text x="50" y="55" class="title">Quick benchmark: measured speedup ranges</text>
  <text x="50" y="82" class="subtitle">Native skfolio n_jobs=1 wall time / accelerated wall time. Three CV methods; repeated synthetic workloads.</text>
  <text x="50" y="108" class="subtitle">A bar starts at the slowest observed result and ends at the fastest; fallback is intentionally near 1x.</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="270" y1="145" x2="1030" y2="145"/>
    <line x1="270" y1="145" x2="270" y2="590"/>
    <line x1="523" y1="145" x2="523" y2="590"/>
    <line x1="777" y1="145" x2="777" y2="590"/>
    <line x1="1030" y1="145" x2="1030" y2="590"/>
  </g>
  <g class="axis">
    <text x="266" y="132">0x</text><text x="514" y="132">10x</text><text x="768" y="132">20x</text><text x="1021" y="132">30x</text>
  </g>
  <g>
    <text x="50" y="186" class="label">Variance</text><rect x="774" y="165" width="256" height="28" rx="5" fill="#2563eb"/><text x="1042" y="186" class="value">19.9 to 29.6x</text>
    <text x="50" y="246" class="label">Semi-variance</text><rect x="462" y="225" width="292" height="28" rx="5" fill="#0f766e"/><text x="766" y="246" class="value">7.6 to 11.5x</text>
    <text x="50" y="306" class="label">Semi-deviation</text><rect x="419" y="285" width="73" height="28" rx="5" fill="#0f766e"/><text x="504" y="306" class="value">5.9 to 8.8x</text>
    <text x="50" y="366" class="label">MAD / FLPM / worst / drawdown</text><rect x="447" y="345" width="145" height="28" rx="5" fill="#7c3aed"/><text x="604" y="366" class="value">7.0 to 12.7x</text>
    <text x="50" y="426" class="label">CVaR</text><rect x="488" y="405" width="169" height="28" rx="5" fill="#7c3aed"/><text x="669" y="426" class="value">8.6 to 15.2x</text>
    <text x="50" y="486" class="label">EVaR*</text><rect x="409" y="465" width="58" height="28" rx="5" fill="#c2410c"/><text x="479" y="486" class="value">5.5 to 7.8x</text>
    <text x="50" y="546" class="label">EqualWeighted / InverseVolatility</text><rect x="384" y="525" width="246" height="28" rx="5" fill="#0891b2"/><text x="642" y="546" class="value">4.5 to 14.2x</text>
    <text x="50" y="606" class="label">Native fallback</text><rect x="270" y="585" width="25" height="28" rx="5" fill="#94a3b8"/><text x="307" y="606" class="value">about 1x</text>
  </g>
  <line x1="50" y1="637" x2="1070" y2="637" stroke="#dce3ef"/>
  <text x="50" y="662" class="note">* One EVaR MultipleRandomizedCV solve retried native skfolio after Clarabel reported InsufficientProgress; it is not counted as a speedup.</text>
  <text x="50" y="683" class="note">Source: benchmark_matrix.py --quick --repeats 3; benchmark machine: Python 3.12, skfolio 1.0.0.</text>
</svg>
