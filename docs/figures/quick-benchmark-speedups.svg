<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Quick benchmark speedups by engine and CV method</title>
  <desc id="desc">Geometric-mean native/accelerated wall-time on the small synthetic suite, split by WalkForward, MultipleRandomizedCV, and purged CPCV. Auto selects OSQP, Clarabel, sequential CVXPY, or fit-assemble for every ObjectiveFunction × RiskMeasure pair.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #55627a; }
    .label { font-size: 14px; font-weight: 600; }
    .engine { font-size: 12px; fill: #66748c; }
    .value { font-size: 13px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
    .section { font-size: 14px; font-weight: 700; fill: #33415c; }
  </style>
  <rect width="1120" height="720" fill="#ffffff"/>
  <text x="50" y="44" class="title">Where the speedup is (small suite)</text>
  <text x="50" y="68" class="subtitle">120 × 6 synthetic returns. Bars are geometric-mean native/auto wall time and start at 0×. Auto covers every ObjectiveFunction × RiskMeasure pair.</text>
  <rect x="520" y="84" width="14" height="14" rx="2" fill="#2563eb"/><text x="540" y="96" class="note">WalkForward · 4 solves</text>
  <rect x="760" y="84" width="14" height="14" rx="2" fill="#0f766e"/><text x="780" y="96" class="note">MRC · 9 solves</text>
  <rect x="960" y="84" width="14" height="14" rx="2" fill="#c2410c"/><text x="980" y="96" class="note">CPCV · 6 solves</text>
  <text x="50" y="128" class="section">Compact engines and closed-form (0–24×)</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="140" x2="1000" y2="140"/>
    <line x1="250" y1="140" x2="250" y2="350"/>
    <line x1="438" y1="140" x2="438" y2="350"/>
    <line x1="625" y1="140" x2="625" y2="350"/>
    <line x1="813" y1="140" x2="813" y2="350"/>
    <line x1="1000" y1="140" x2="1000" y2="350"/>
  </g>
  <g class="axis">
    <text x="246" y="132">0×</text>
    <text x="434" y="132">6×</text>
    <text x="621" y="132">12×</text>
    <text x="809" y="132">18×</text>
    <text x="996" y="132">24×</text>
  </g>
  <g>
    <text x="50" y="176" class="label">Variance · OSQP</text>
    <rect x="250" y="148" width="539" height="16" rx="3" fill="#2563eb"/><text x="797" y="161" class="value">17.3×</text>
    <rect x="250" y="168" width="667" height="16" rx="3" fill="#0f766e"/><text x="925" y="181" class="value">21.3×</text>
    <rect x="250" y="188" width="458" height="16" rx="3" fill="#c2410c"/><text x="716" y="201" class="value">14.6×</text>
    <text x="50" y="246" class="label">Scenario · Clarabel</text>
    <rect x="250" y="218" width="310" height="16" rx="3" fill="#2563eb"/><text x="568" y="231" class="value">9.93×</text>
    <rect x="250" y="238" width="344" height="16" rx="3" fill="#0f766e"/><text x="602" y="251" class="value">11.0×</text>
    <rect x="250" y="258" width="221" height="16" rx="3" fill="#c2410c"/><text x="479" y="271" class="value">7.08×</text>
    <text x="50" y="316" class="label">EqualWeighted / Random / InvVol</text>
    <text x="50" y="334" class="engine">isolated compact suite</text>
    <rect x="250" y="288" width="225" height="16" rx="3" fill="#2563eb"/><text x="483" y="301" class="value">7.20×</text>
    <text x="250" y="321" class="engine">—</text>
    <text x="250" y="341" class="engine">—</text>
  </g>
  <text x="50" y="380" class="section">Sequential CVXPY reuse and fit-assemble (0–4×)</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="250" y1="392" x2="1000" y2="392"/>
    <line x1="250" y1="392" x2="250" y2="532"/>
    <line x1="438" y1="392" x2="438" y2="532"/>
    <line x1="625" y1="392" x2="625" y2="532"/>
    <line x1="813" y1="392" x2="813" y2="532"/>
    <line x1="1000" y1="392" x2="1000" y2="532"/>
  </g>
  <g class="axis">
    <text x="246" y="384">0×</text>
    <text x="434" y="384">1×</text>
    <text x="621" y="384">2×</text>
    <text x="809" y="384">3×</text>
    <text x="996" y="384">4×</text>
  </g>
  <g>
    <text x="50" y="428" class="label">Sequential MeanRisk</text>
    <rect x="250" y="400" width="313" height="16" rx="3" fill="#2563eb"/><text x="571" y="413" class="value">1.67×</text>
    <rect x="250" y="420" width="300" height="16" rx="3" fill="#0f766e"/><text x="558" y="433" class="value">1.60×</text>
    <rect x="250" y="440" width="207" height="16" rx="3" fill="#c2410c"/><text x="465" y="453" class="value">1.10×</text>
    <text x="50" y="498" class="label">Fit-assemble (ratio, …)</text>
    <rect x="250" y="470" width="217" height="16" rx="3" fill="#2563eb"/><text x="475" y="483" class="value">1.16×</text>
    <rect x="250" y="490" width="207" height="16" rx="3" fill="#0f766e"/><text x="465" y="503" class="value">1.10×</text>
    <rect x="250" y="510" width="220" height="16" rx="3" fill="#c2410c"/><text x="478" y="523" class="value">1.17×</text>
  </g>
  <line x1="50" y1="555" x2="1070" y2="555" stroke="#dce3ef"/>
  <text x="50" y="582" class="note">Sequential covers std, Ulcer, MAXIMIZE_RETURN, risk limits, linear constraints, fees, and L1. MAXIMIZE_RATIO stays on fit-assemble (no homogenization proxy).</text>
  <text x="50" y="604" class="note">Closed-form EqualWeighted / Random / InverseVolatility is the isolated compact-suite median (not re-timed here). Red bars would be slowdowns versus native; none appear on this small suite geometric mean.</text>
  <text x="50" y="626" class="note">Source: benchmark/run_benchmark.py --quick; WalkForward, MultipleRandomizedCV, CombinatorialPurgedCV. Python 3.12, skfolio 1.0.0.</text>
  <text x="50" y="648" class="note">This small suite still charges every fold a CVXPY setup cost, so compact Clarabel looks closer to OSQP than on 20-year WalkForward/MRC.</text>
  <text x="50" y="670" class="note">MRC extras (min_return, named linear constraints) are skipped: asset subsets drop column names, and min_return can be infeasible on random 12-asset windows.</text>
</svg>
