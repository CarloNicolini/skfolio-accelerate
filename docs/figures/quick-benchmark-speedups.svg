<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Quick benchmark speedups by engine</title>
  <desc id="desc">Median native-to-accelerated wall-time ratio on the small synthetic suite. Bars start at zero so the OSQP variance path is visually larger than scenario Clarabel, closed-form CV savings, and fit-assemble. Whiskers show min and max across WalkForward, purged CPCV, and MultipleRandomizedCV.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #172033; }
    .title { font-size: 26px; font-weight: 700; }
    .subtitle { font-size: 14px; fill: #55627a; }
    .label { font-size: 15px; font-weight: 600; }
    .value { font-size: 14px; fill: #33415c; }
    .axis { font-size: 13px; fill: #66748c; }
    .note { font-size: 13px; fill: #55627a; }
  </style>
  <rect width="1120" height="680" fill="#ffffff"/>
  <text x="50" y="48" class="title">Where the speedup is (small suite)</text>
  <text x="50" y="74" class="subtitle">120 observations × 6 assets. Bars are median native/accelerated wall time and start at 0×. Whiskers are min–max across three CV methods.</text>
  <text x="50" y="96" class="subtitle">Variance is the compact OSQP path. Scenario MeanRisk reuses a Clarabel cone. Closed-form skips native CV machinery. Fit-assemble still calls native fit.</text>
  <g stroke="#dce3ef" stroke-width="1">
    <line x1="340" y1="130" x2="1000" y2="130"/>
    <line x1="340" y1="130" x2="340" y2="530"/>
    <line x1="505" y1="130" x2="505" y2="530"/>
    <line x1="670" y1="130" x2="670" y2="530"/>
    <line x1="835" y1="130" x2="835" y2="530"/>
    <line x1="1000" y1="130" x2="1000" y2="530"/>
  </g>
  <g class="axis">
    <text x="336" y="118">0×</text>
    <text x="496" y="118">8×</text>
    <text x="661" y="118">16×</text>
    <text x="826" y="118">24×</text>
    <text x="986" y="118">32×</text>
  </g>
  <!-- scale: 20.625 px per 1×; x = 340 + 20.625 * speedup -->
  <g>
    <text x="50" y="178" class="label">Variance · OSQP</text>
    <rect x="340" y="158" width="424" height="26" rx="4" fill="#2563eb"/>
    <line x1="736" y1="171" x2="962" y2="171" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="736" y1="164" x2="736" y2="178" stroke="#1e3a8a" stroke-width="2"/>
    <line x1="962" y1="164" x2="962" y2="178" stroke="#1e3a8a" stroke-width="2"/>
    <text x="972" y="178" class="value">21×  (19–30)</text>

    <text x="50" y="248" class="label">CVaR · Clarabel</text>
    <rect x="340" y="228" width="270" height="26" rx="4" fill="#7c3aed"/>
    <line x1="518" y1="241" x2="648" y2="241" stroke="#5b21b6" stroke-width="2"/>
    <line x1="518" y1="234" x2="518" y2="248" stroke="#5b21b6" stroke-width="2"/>
    <line x1="648" y1="234" x2="648" y2="248" stroke="#5b21b6" stroke-width="2"/>
    <text x="658" y="248" class="value">13×  (9–15)</text>

    <text x="50" y="318" class="label">Other scenario MeanRisk</text>
    <rect x="340" y="298" width="177" height="26" rx="4" fill="#0f766e"/>
    <line x1="435" y1="311" x2="609" y2="311" stroke="#115e59" stroke-width="2"/>
    <line x1="435" y1="304" x2="435" y2="318" stroke="#115e59" stroke-width="2"/>
    <line x1="609" y1="304" x2="609" y2="318" stroke="#115e59" stroke-width="2"/>
    <text x="619" y="318" class="value">8.6×  (4.6–13)</text>

    <text x="50" y="388" class="label">EqualWeighted / Random / InvVol</text>
    <rect x="340" y="368" width="149" height="26" rx="4" fill="#0891b2"/>
    <line x1="435" y1="381" x2="601" y2="381" stroke="#0e7490" stroke-width="2"/>
    <line x1="435" y1="374" x2="435" y2="388" stroke="#0e7490" stroke-width="2"/>
    <line x1="601" y1="374" x2="601" y2="388" stroke="#0e7490" stroke-width="2"/>
    <text x="611" y="388" class="value">7.2×  (4.6–13)</text>

    <text x="50" y="458" class="label">Fit-assemble (HRP, stdev, …)</text>
    <rect x="340" y="438" width="24" height="26" rx="4" fill="#64748b"/>
    <line x1="361" y1="451" x2="383" y2="451" stroke="#334155" stroke-width="2"/>
    <line x1="361" y1="444" x2="361" y2="458" stroke="#334155" stroke-width="2"/>
    <line x1="383" y1="444" x2="383" y2="458" stroke="#334155" stroke-width="2"/>
    <text x="393" y="458" class="value">1.2×  (1.0–2.1)</text>

    <text x="50" y="528" class="label">Native fallback</text>
    <rect x="340" y="508" width="21" height="26" rx="4" fill="#94a3b8"/>
    <text x="371" y="528" class="value">~1×  (pipelines, costs)</text>
  </g>
  <line x1="50" y1="560" x2="1070" y2="560" stroke="#dce3ef"/>
  <text x="50" y="586" class="note">Closed-form whiskers omit isolated EqualWeighted/Random WalkForward: native time is a few milliseconds and process noise inflates the ratio. InverseVolatility and the other two CVs are used instead.</text>
  <text x="50" y="608" class="note">One EVaR MultipleRandomizedCV Clarabel solve retried native fit plus assembly (1.1×) and is counted under fit-assemble, not compact EVaR. EDAR WalkForward/MRC failed in native Clarabel on this suite.</text>
  <text x="50" y="630" class="note">Source: benchmarks/benchmark_matrix.py --quick --repeats 3; Python 3.12, skfolio 1.0.0. Median of three isolated-process runs per cell.</text>
  <text x="50" y="652" class="note">This small suite still charges every fold a CVXPY setup cost, so scenario Clarabel looks closer to variance than it does on 20-year WalkForward/MRC (figure above).</text>
</svg>
