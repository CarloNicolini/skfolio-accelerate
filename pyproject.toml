[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "skfolio-accelerate"
version = "0.1.0"
description = "Compiled massive cross-validation and hyperparameter search for skfolio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "skfolio-accelerate contributors" },
]
keywords = ["skfolio", "portfolio", "cvxpy", "clarabel", "cross-validation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "License :: OSI Approved :: BSD License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "pandas>=1.5",
  "scikit-learn>=1.4",
  "cvxpy>=1.5",
  "clarabel>=0.9.0,<0.12",
  "skfolio>=0.7",
  "joblib>=1.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
native = []

[project.urls]
Repository = "https://github.com/skfolio/skfolio-accelerate"

[tool.maturin]
python-source = "src"
module-name = "skfolio_accelerate._skfolio_accel"
manifest-path = "rust/Cargo.toml"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "slow: longer correctness / timing experiments",
  "native: requires the compiled Rust extension",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
