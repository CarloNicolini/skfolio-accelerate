[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skfolio-accelerate"
version = "0.1.0"
description = "Amortized multi-path cross_val_predict for skfolio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "skfolio-accelerate contributors" },
]
keywords = ["skfolio", "portfolio", "cross-validation", "osqp", "clarabel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "osqp>=1.0,<2",
  "skfolio>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.urls]
Repository = "https://github.com/CarloNicolini/skfolio-accelerate"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "slow: longer correctness / timing experiments",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
