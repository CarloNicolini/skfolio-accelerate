[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skfolio-accelerate"
version = "0.1.0"
description = "Amortized multi-path cross_val_predict for skfolio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
authors = [
  { name = "skfolio-accelerate contributors" },
]
keywords = ["skfolio", "portfolio", "cross-validation", "osqp", "clarabel"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: BSD License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "osqp>=1.0,<2",
  "highspy>=1.8",
  "skfolio>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "psutil>=7.2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
]
docs = [
  "Sphinx>=7.2",
  "pydata-sphinx-theme~=0.16",
  "numpydoc",
  "sphinx-gallery",
  "sphinx-copybutton",
  "matplotlib",
  "plotly>=5.0",
  "kaleido>=0.2.1",
]
benchmark = [
  "plotly>=5.0",
  "kaleido>=0.2.1",
]

[project.urls]
Documentation = "https://carlonicolini.github.io/skfolio-accelerate/"
Repository = "https://github.com/CarloNicolini/skfolio-accelerate"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skfolio_accelerate = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
  "slow: longer correctness / timing experiments",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
